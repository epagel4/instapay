[versions]
spring-boot = "3.5.16"
spotless = "8.10.4"
spotbugs-plugin = "6.5.13"
archunit = "1.5.1"
springdoc = "2.8.17"
jqwik = "1.10.2"

[plugins]
gatling = { id = "io.gatling.gradle", version = "3.15.1.3" }

[libraries]
# Gradle plugins consumed by build-logic convention plugins
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }

archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
